services:
  caddy:
    image: caddy:2.10.0
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./conf/${CADDY_CONFIG_FILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${APPDIR_PUZLINGHOME:-/srv/puzlinghome}:/srv/puzlinghome
      - /var/log/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
